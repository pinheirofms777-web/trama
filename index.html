<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Trama</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#151618">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trama">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#151618;--panel:#1d1e21;--line:#2b2c30;--txt:#ececec;--mut:#85878d;--acc:#4c8dff;--r:#ff3b30;--g:#00ba4a;--f:#232427;--c:#38393d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--bg);color:var(--txt);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:active,.card:active,.opt:active,.bb:active,.sr:active{opacity:.55;transition:opacity 0s}
input,textarea{font:inherit}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.view[hidden]{display:none}
.hd{display:flex;justify-content:space-between;align-items:flex-end;padding:calc(env(safe-area-inset-top) + 18px) 20px 12px;border-bottom:1px solid var(--line)}
.hd .sub{font-size:13px;line-height:16px;font-weight:500;color:#a4a6ac;letter-spacing:.02em}
.hd h1{margin:2px 0 0;font-size:30px;line-height:40px;font-weight:700}
.hb{display:flex;gap:6px;align-items:center}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--panel);color:var(--txt);flex:none}
.ib:disabled{opacity:.25;cursor:default}
.ib.on{background:#2f3036;color:#fff}
.ib svg,.bb svg{display:block}
#list{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 20px 110px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid var(--line)}
.thumb{height:118px;overflow:hidden;display:block}
.thumb svg{width:100%;height:100%;display:block}
.cn{padding:10px 12px 12px}
.cn b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.cm{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(21,22,24,.72);color:#fff}
.empty{padding:70px 30px;text-align:center;color:var(--mut);font-size:14px;line-height:1.6}
.fab{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);background:var(--txt);color:#111;font-weight:700;font-size:15px;padding:14px 20px;border-radius:26px;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block;margin-right:6px}
.syncdot.ok{background:var(--g)}.syncdot.er{background:var(--r)}
/* editor */
.tb{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.tbt{flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 6px;cursor:pointer;text-align:left}
#cv{position:relative;flex:1;overflow:hidden;background:#fff}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
#vp text,#vp image,#vp .ic{pointer-events:none}
#ted{position:absolute;z-index:4;border:2px solid var(--acc);border-radius:8px;outline:0;resize:none;overflow:hidden;padding:4px 8px;line-height:1.3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-user-select:text;user-select:text;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#ted[hidden]{display:none}
.zc{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zc .ib{width:38px;height:38px;background:rgba(21,22,24,.82)}
.srch{position:absolute;left:10px;right:10px;top:10px;z-index:5;display:flex;gap:6px;align-items:center;background:rgba(21,22,24,.94);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px}
.srch[hidden]{display:none}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font-size:16px;padding:6px 0;-webkit-user-select:text;user-select:text}
.srch small{color:var(--mut);font-size:12px;white-space:nowrap}
.hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;color:#fff;pointer-events:none;z-index:2}
.hint span{background:rgba(21,22,24,.85);padding:7px 12px;border-radius:14px}
.bar{display:flex;gap:2px;overflow-x:auto;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);border-top:1px solid var(--line);background:var(--bg);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar::-webkit-scrollbar{display:none}
.bb{flex:none;min-width:60px;padding:6px 8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--txt);white-space:nowrap}
.bb.off{opacity:.28;pointer-events:none}
.bb.on{background:#2a2b2f}
.bb.dg{color:#ff6b61}
/* sheets */
.shade{z-index:30;position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:90%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:14px 20px calc(env(safe-area-inset-bottom) + 24px);animation:up .16s ease-out;-webkit-user-select:none;user-select:none}
.sheet.tall{height:90%}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:3px;background:#55565b;margin:0 auto 14px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.sh b{font-size:17px}.lnk{color:var(--txt);font-size:14px;padding:4px 2px}
.sub{font-size:12px;color:var(--mut);letter-spacing:.04em;margin-top:16px;text-transform:uppercase}
.note{font-size:12px;color:var(--mut);line-height:1.5;padding:6px 0}
.opt{padding:12px;border-radius:10px;border:1px solid var(--line);text-align:center;font-size:14px;cursor:pointer;background:var(--bg)}
.opt.on{background:var(--txt);color:#111;border-color:var(--txt);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips .opt{padding:9px 13px;font-size:13px}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--txt);color:#111;font-weight:700;font-size:15px;margin-top:14px}
.btn.s{background:var(--bg);color:var(--txt);border:1px solid var(--line)}
.btn.d{background:var(--r);color:#fff}
input[type=text],input[type=password],input[type=date],textarea.ta{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);font-size:16px;padding:12px;border-radius:10px;margin:8px 0 6px;-webkit-user-select:text;user-select:text;outline:0}
input[type=date]{-webkit-appearance:none;appearance:none;height:46px;color-scheme:dark}
textarea.ta{min-height:150px;resize:vertical;line-height:1.4}
input[type=range]{width:100%;margin:12px 0}
.sr{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer;gap:12px}
.sr span:last-child{color:var(--mut);text-align:right}
.lay{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.lay .opt{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px}
.lay svg{width:44px;height:30px}
.th{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.th .opt{padding:8px 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:6px}
.sw{display:flex;gap:2px}.sw i{width:10px;height:18px;border-radius:2px;display:block}
.cols{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.col{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.col.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.col.auto{background:conic-gradient(#e8574a,#f2a03d,#3bb273,#2f7fd8,#8a5cd0,#e8574a)}
.mk{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}
.mk .opt{padding:10px 0;display:grid;place-items:center}
.mk svg{width:24px;height:24px}
.tmpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.tmpl .card{border-radius:12px}
.tmpl .thumb{height:96px}
.tmpl .cn b{font-size:13px}
.fams{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:4px;padding-bottom:4px}
.fams::-webkit-scrollbar{display:none}
.fams .opt{flex:none;padding:9px 14px;font-size:13px}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:#2d2e32;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none}
.toast[hidden]{display:none}
.stat{font-size:13px;line-height:1.5;color:var(--txt);padding:2px 0 8px}
</style>
</head>
<body>
<div id="app">
  <div id="v-list" class="view">
    <div class="hd"><div><div class="sub" id="l-sub"></div><h1>Trama</h1></div><div class="hb"><button class="ib" data-a="settings" aria-label="Configurações" id="b-set"></button></div></div>
    <div id="list"></div>
    <button class="fab" data-a="newmap" id="b-new"></button>
  </div>
  <div id="v-ed" class="view" hidden>
    <div class="tb">
      <button class="ib" data-a="home" aria-label="Voltar" id="t-back"></button>
      <button class="tbt" data-a="rename" id="t-name"></button>
      <button class="ib" data-a="undo" aria-label="Desfazer" id="t-undo"></button>
      <button class="ib" data-a="redo" aria-label="Refazer" id="t-redo"></button>
      <button class="ib" data-a="search" aria-label="Buscar" id="t-search"></button>
      <button class="ib" data-a="mstyle" aria-label="Estilo do mapa" id="t-style"></button>
      <button class="ib" data-a="export" aria-label="Compartilhar" id="t-share"></button>
      <button class="ib" data-a="mtext" aria-label="Mais" id="t-more"></button>
    </div>
    <div id="cv">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="vp"></g><g id="ov"></g></svg>
      <textarea id="ted" hidden rows="1" spellcheck="false" autocapitalize="sentences"></textarea>
      <div class="srch" id="srch" hidden><input type="text" id="sq" placeholder="Buscar tópico" autocomplete="off"><small id="sc"></small><button class="ib" data-a="snext" id="s-next" style="width:34px;height:34px"></button><button class="ib" data-a="sclose" id="s-close" style="width:34px;height:34px"></button></div>
      <div class="zc"><button class="ib" data-a="zin" id="z-in"></button><button class="ib" data-a="zout" id="z-out"></button><button class="ib" data-a="fit" id="z-fit"></button></div>
      <div class="hint" id="hint" hidden><span id="hint-t"></span></div>
    </div>
    <div class="bar" id="bar"></div>
  </div>
  <div id="sheets"></div>
  <div class="toast" id="toast" hidden></div>
</div>
<input type="file" id="f-img" accept="image/*" hidden>
<input type="file" id="f-imp" accept="application/json,.json" hidden>
<script>
'use strict';
const VER='v2';
const FONT="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif";
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36).slice(-5)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad2=n=>String(n).padStart(2,'0');
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fdate=ts=>{const d=new Date(ts);return pad2(d.getDate())+' '+MES[d.getMonth()]+' '+d.getFullYear()};
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const dueTxt=k=>{const p=String(k).split('-');return p.length===3?p[2]+'/'+p[1]:''};
/* cores */
const hex2rgb=h=>{h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h.slice(0,6),16)||0;return[(n>>16)&255,(n>>8)&255,n&255]};
const rgb2hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const x=hex2rgb(a),y=hex2rgb(b);return rgb2hex(x[0]+(y[0]-x[0])*t,x[1]+(y[1]-x[1])*t,x[2]+(y[2]-x[2])*t)};
const lum=h=>{const c=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const onCol=h=>lum(h)>.4?'#1b1c1f':'#ffffff';
/* IndexedDB: banco próprio "trama" */
const IDB={
  open(){return this._o||(this._o=new Promise((ok,no)=>{const r=indexedDB.open('trama',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))},
  async get(k){const db=await this.open();return new Promise((ok,no)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})},
  async set(k,v){const db=await this.open();return new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})},
  async del(k){const db=await this.open();return new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})},
  async all(prefix){const db=await this.open();return new Promise((ok,no)=>{const out=[],q=db.transaction('kv').objectStore('kv').openCursor(IDBKeyRange.bound(prefix,prefix+'￿'));q.onsuccess=()=>{const c=q.result;if(c){out.push([c.key,c.value]);c.continue()}else ok(out)};q.onerror=()=>no(q.error)})}
};
/* lê (só leitura) a conexão de sincronização que o Rastro já guardou neste mesmo domínio; nunca cria o banco do Rastro */
function readRastroCfg(){return new Promise(ok=>{let done=false;const fin=v=>{if(!done){done=true;ok(v)}};
  try{const r=indexedDB.open('rastro');
    r.onupgradeneeded=e=>{try{e.target.transaction.abort()}catch(_){}fin(null)};
    r.onerror=()=>fin(null);
    r.onsuccess=()=>{const db=r.result;try{if(!db.objectStoreNames.contains('kv')){db.close();return fin(null)}
      const q=db.transaction('kv').objectStore('kv').get('cfg');q.onsuccess=()=>{db.close();const c=q.result;fin(c&&c.repo&&c.tok?{repo:c.repo,tok:c.tok}:null)};q.onerror=()=>{db.close();fin(null)}}catch(_){try{db.close()}catch(e){}fin(null)}}
  }catch(_){fin(null)}})}
/* estado */
let D={recs:{}},VIEWS={},CFG=null,M=null,SC=null,G=new Map(),UN={st:[],rd:[]};
const S={view:'list',sel:null,selRel:null,edit:null,newNode:null,relFrom:null,q:'',qi:0,sheet:null,tmpl:'blank'};
const dirty=new Set();let pT=0;
const listMaps=()=>Object.values(D.recs).filter(r=>r&&r.v).map(r=>r.v).sort((a,b)=>(b.up||0)-(a.up||0));
function schedPersist(){clearTimeout(pT);pT=setTimeout(flushPersist,350)}
async function flushPersist(){clearTimeout(pT);pT=0;const ids=[...dirty];dirty.clear();
  for(const id of ids){const r=D.recs[id];if(r){try{await IDB.set('m:'+id,r)}catch(e){}}}}
function touch(m){m=m||M;if(!m)return;const r=D.recs[m.id];if(!r)return;m.up=Date.now();r.ts=m.up;dirty.add(m.id);schedPersist();if(typeof schedSync==='function')schedSync()}
function usedImgs(n,set){if(n.im)set.add(n.im);(n.c||[]).forEach(c=>usedImgs(c,set));return set}
function gcImgs(m){if(!m||!m.imgs)return;const u=usedImgs(m.root,new Set());let ch=false;for(const k of Object.keys(m.imgs))if(!u.has(k)){delete m.imgs[k];ch=true}if(ch)touch(m)}
function newMapObj(name,o){o=o||{};const now=Date.now();
  return {id:uid(),name:name||'Novo mapa',cr:now,up:now,lay:o.lay||'bi',th:o.th||'claro',cn:o.cn||'curve',cb:o.cb===0?0:1,lw:o.lw||2,fs:o.fs==null?1:o.fs,root:o.root||{id:uid(),t:'Tópico central',c:[]},rel:[],imgs:{}}}
function addMap(m){D.recs[m.id]={v:m,ts:m.up};dirty.add(m.id);schedPersist();if(typeof schedSync==='function')schedSync()}
/* desfazer / refazer: instantâneos do conteúdo do mapa (imagens ficam fora, por id) */
const SNAPK=['name','lay','th','cn','cb','lw','fs','root','rel'];
function snap(){const o={};SNAPK.forEach(k=>o[k]=M[k]);return JSON.stringify(o)}
function pushUndo(){UN.st.push(snap());if(UN.st.length>80)UN.st.shift();UN.rd=[]}
function restore(s){const o=JSON.parse(s);SNAPK.forEach(k=>{if(o[k]===undefined)delete M[k];else M[k]=o[k]})}
function afterRestore(){if(S.sel&&!findNode(S.sel))S.sel=null;if(S.selRel&&!(M.rel||[]).some(r=>r.id===S.selRel))S.selRel=null;touch(M);relayout();draw()}
function undo(silent){if(!M||!UN.st.length)return;if(!silent)UN.rd.push(snap());restore(UN.st.pop());afterRestore()}
function redo(){if(!M||!UN.rd.length)return;UN.st.push(snap());restore(UN.rd.pop());afterRestore()}
/* árvore */
function findNode(id,n,par){n=n||M.root;if(n.id===id)return{n,par:par||null};for(const c of n.c||[]){const r=findNode(id,c,n);if(r)return r}return null}
function isDesc(anc,id){if(anc.id===id)return true;return (anc.c||[]).some(c=>isDesc(c,id))}
function countAll(n){let k=1;(n.c||[]).forEach(c=>k+=countAll(c));return k}
function toast(t,ms){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},ms||2200)}
/* ---------- temas ---------- */
const THEMES=[
 {id:'claro',n:'Claro',bg:'#ffffff',root:['#1f2430','#ffffff'],pal:['#e8574a','#f2a03d','#3bb273','#2f7fd8','#8a5cd0','#18a5b5','#d95f9c','#7a8793'],line:'#9aa3ad',tx:'#1f2430',sh:['r','r','u']},
 {id:'pastel',n:'Pastel',bg:'#fbf7f2',root:['#5b6b8c','#ffffff'],pal:['#f4a6a0','#f7cf8b','#a6d8b4','#9cc7f0','#c4b0ea','#8fd8d8','#f2a9c9','#bfc7d1'],line:'#b9b2a8',tx:'#33384a',sh:['p','p','u']},
 {id:'escuro',n:'Escuro',bg:'#17181b',root:['#ececec','#17181b'],pal:['#ff6b5e','#ffb347','#4cd694','#5aa9ff','#b38bff','#3cd0e0','#ff7fbf','#9aa5b1'],line:'#6a6d75',tx:'#ececec',sh:['r','r','u']},
 {id:'oceano',n:'Oceano',bg:'#f2f9fb',root:['#0e3b52','#ffffff'],pal:['#0f8ea8','#1db5a6','#4a9be0','#2d6fb7','#69c4c9','#7e8fd6','#3d5a80','#98c1d9'],line:'#8fb3c2',tx:'#0e3b52',sh:['r','r','u']},

      const body={message:'trama '+VER+' '+new Date().toISOString(),content:b64e(JSON.stringify(out))};if(SYN.sha)body.sha=SYN.sha;
      const r=await GH('PUT',`/repos/${CFG.repo}/contents/${SYN.file}`,body);
      if(r.ok){const j=await r.json();SYN.sha=j.content&&j.content.sha;SYN.etag=null;for(const [id,l] of Object.entries(D.recs))SYN.remoteTs[id]=l.ts||0;break}
      if((r.status===409||r.status===422)&&i<2){SYN.etag=null;SYN.sha=null;continue}throw new Error(errTxt(r))}
    SYN.last=Date.now();setSyn('ok','Sincronizado '+new Date().toTimeString().slice(0,5))}
  catch(e){setSyn('er',e&&e.message&&!/Failed to fetch|Load failed|NetworkError/.test(e.message)?e.message:'Sem conexão')}
  finally{SYN.busy=false;if(SYN.again){SYN.again=false;schedSync()}}}
function onMerged(){if(S.view==='ed'&&M){const r=D.recs[M.id];if(!r||!r.v){M=null;S.sheet&&closeSheet(true);showView('list');toast('Este mapa foi excluído em outro aparelho');return}
    if(r.v!==M&&!S.edit){M=r.v;UN={st:[],rd:[]};S.sel=S.sel&&findNode(S.sel)?S.sel:null;draw();toast('Mapa atualizado por outro aparelho')}}
  else if(S.view==='list')renderList()}
function schedSync(){if(!CFG)return;clearTimeout(SYN.timer);SYN.timer=setTimeout(syncNow,2500)}
function syncSoon(){if(!CFG)return;clearTimeout(SYN.timer);SYN.timer=setTimeout(syncNow,200)}
const syncPull=syncNow;
async function connect(repo,tok){repo=String(repo||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');tok=String(tok||'').trim();if(!/^[\w.-]+\/[\w.-]+$/.test(repo))throw new Error('Repositório no formato dono/nome');if(!tok)throw new Error('Informe o token');
  const old=CFG;CFG={repo,tok};try{const r=await GH('GET','/repos/'+repo);if(!r.ok)throw new Error(errTxt(r));const j=await r.json();if(!j.private)throw new Error('O repositório precisa ser privado');
    await IDB.set('cfg',{repo,tok});SYN.etag=null;SYN.sha=null;SYN.remoteTs={};syncNow()}catch(e){CFG=old;throw e}}
async function disconnect(){CFG=null;await IDB.del('cfg');SYN.state='off';SYN.msg='';SYN.etag=null;SYN.sha=null}
/* ---------- configurações ---------- */
function renderSettings(){const r=S.sheet&&S.sheet.firstChild;if(!r)return;r.innerHTML='<div class="grab"></div>'+settingsHtml();bindSettings(r)}
function settingsHtml(){const c=CFG;
  return `${shHead('Configurações')}<div class="sub">Sincronização</div>
  ${c?`<div class="stat"><span class="syncdot ${SYN.state==='ok'?'ok':SYN.state==='er'?'er':''}"></span>${esc(SYN.msg||'Conectado')}<br><span style="color:var(--mut)">${esc(c.repo)} · ${SYN.file}</span></div><button class="btn s" id="sy">Sincronizar agora</button><button class="btn s" id="dc">Desconectar este aparelho</button>`
  :`<div class="note">Os mapas ficam só neste aparelho até você conectar. Use o mesmo repositório privado do Rastro; o Trama grava num arquivo separado (${SYN.file}) e não mexe nos dados do Rastro.</div>${S.rastroCfg?`<button class="btn" id="ur">Usar a conexão do Rastro</button>`:''}<input type="text" id="rp" placeholder="dono/repositório-privado" autocomplete="off" autocapitalize="off"><input type="password" id="tk" placeholder="Token do GitHub" autocomplete="off"><button class="btn${S.rastroCfg?' s':''}" id="cn">Conectar</button><div class="note" id="cerr" style="color:#ff6b61"></div>`}
  <div class="sub">Backup</div><button class="btn s" id="bk">Exportar todos os mapas (JSON)</button><button class="btn s" id="im">Importar backup</button>
  <div class="note" style="margin-top:14px">Trama ${VER}</div>`}
function bindSettings(r){bindClose(r);const $$=s=>r.querySelector(s);
  if($$('#sy'))$$('#sy').onclick=()=>{syncNow()};if($$('#dc'))$$('#dc').onclick=async()=>{if(confirm('Desconectar? Os mapas continuam neste aparelho.')){await disconnect();renderSettings();renderList()}};
  const go=async(repo,tok)=>{const e=$$('#cerr');if(e)e.textContent='';try{await connect(repo,tok);renderSettings()}catch(err){if(e)e.textContent=err.message||'Falha ao conectar'}};
  if($$('#ur'))$$('#ur').onclick=()=>go(S.rastroCfg.repo,S.rastroCfg.tok);if($$('#cn'))$$('#cn').onclick=()=>go($$('#rp').value,$$('#tk').value);
  $$('#bk').onclick=()=>exportAll();$$('#im').onclick=()=>$('#f-imp').click()}
async function openSettings(){S.rastroCfg=CFG?null:await readRastroCfg();S.sheetKind='settings';openSheet(settingsHtml(),bindSettings,{tall:true,onClose:()=>{S.sheetKind=null}})}
/* ---------- PDF mínimo (uma página com a imagem do mapa em JPEG) ---------- */
function makePdf(jpg,iw,ih,pw,ph,box,title){const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const put=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(n,body)=>{off[n]=len;put(n+' 0 obj\n');put(body);put('\nendobj\n')};
  put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw.toFixed(2)} ${ph.toFixed(2)}] /Resources << /XObject << /Im0 4 0 R >> /ProcSet [/PDF /ImageC] >> /Contents 5 0 R >>`);
  off[4]=len;put(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);put(jpg);put('\nendstream\nendobj\n');
  const cs=`q ${box.w.toFixed(2)} 0 0 ${box.h.toFixed(2)} ${box.x.toFixed(2)} ${box.y.toFixed(2)} cm /Im0 Do Q`;
  obj(5,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  const safe=String(title||'Trama').replace(/[^\x20-\x7E]/g,'?').replace(/[()\\]/g,'');
  obj(6,`<< /Title (${safe}) /Producer (Trama) >>`);
  const xr=len;let x=`xref\n0 7\n0000000000 65535 f \n`;for(let i=1;i<=6;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  put(x+`trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xr}\n%%EOF`);
  const out=new Uint8Array(len);let p=0;parts.forEach(b=>{out.set(b,p);p+=b.length});return new Blob([out],{type:'application/pdf'})}
const dataToBytes=d=>{const b=atob(d.split(',')[1]),o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o};
async function buildPdf(m,mode){const {cv,k,sc}=await renderCanvas(m,8000,{title:true,scale:mode==='size'?2.5:3});
  const jpg=dataToBytes(cv.toDataURL('image/jpeg',.92)),iw=cv.width,ih=cv.height;let pw,ph,box;
  if(mode==='size'){const s=.75;pw=iw/k*s;ph=ih/k*s;box={x:0,y:0,w:pw,h:ph}}
  else{const land=iw>=ih;pw=land?841.89:595.28;ph=land?595.28:841.89;const mg=24,aw=pw-2*mg,ah=ph-2*mg,s=Math.min(aw/iw,ah/ih),w=iw*s,h=ih*s;box={x:(pw-w)/2,y:(ph-h)/2,w,h}}
  return makePdf(jpg,iw,ih,pw,ph,box,m.name)}
const fname=(m,ext)=>(m.name||'mapa').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()+'.'+ext;
async function deliver(blob,name,type){const file=new File([blob],name,{type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return'share'}}catch(e){if(e&&e.name==='AbortError')return'cancel'}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},4000);return'download'}
async function exportPng(m){const {cv}=await renderCanvas(m,6000,{title:true,scale:2.5});const blob=await new Promise(ok=>cv.toBlob(ok,'image/png'));return deliver(blob,fname(m,'png'),'image/png')}
function mapBackup(ms){return JSON.stringify({trama:1,ver:VER,at:Date.now(),maps:ms})}
async function exportAll(){const ms=listMaps();if(!ms.length)return toast('Nenhum mapa para exportar');await deliver(new Blob([mapBackup(ms)],{type:'application/json'}),'trama-backup-'+todayKey()+'.json','application/json')}
function importBackup(txt){let o;try{o=JSON.parse(txt)}catch(e){return toast('Arquivo inválido')}const ms=o&&o.maps;if(!Array.isArray(ms)||!ms.length)return toast('Nenhum mapa no arquivo');let n=0;
  ms.forEach(m=>{if(!m||!m.root||!m.id)return;if(D.recs[m.id]&&D.recs[m.id].v){const old=D.recs[m.id].v;if(JSON.stringify(old.root)===JSON.stringify(m.root))return;m.id=uid();m.name+=' (importado)'}m.up=Date.now();addMap(m);n++});
  toast(n?n+' mapa(s) importado(s)':'Nada novo para importar');if(S.view==='list')renderList()}
function bindImport(){$('#f-imp').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;importBackup(await f.text());e.target.value=''})}
/* ---------- tela de compartilhar ---------- */
function openExport(){const m=M;if(!m)return;let busy=false;
  openSheet(shHead('Compartilhar')+`<div class="sr" data-e="pdfa"><span>PDF em A4 (ajustado à página)</span><span>PDF</span></div><div class="sr" data-e="pdfs"><span>PDF no tamanho do mapa</span><span>PDF</span></div><div class="sr" data-e="png"><span>Imagem PNG</span><span>PNG</span></div><div class="sr" data-e="txt"><span>Texto em tópicos</span><span>TXT</span></div><div class="sr" data-e="json"><span>Backup deste mapa</span><span>JSON</span></div><div class="note" id="en">O PDF é uma imagem do mapa: o texto não é selecionável nem pesquisável. Em mapas muito grandes a resolução é reduzida.</div>`,r=>{bindClose(r);
    onSheet(r,'[data-e]',async el=>{if(busy)return;busy=true;const a=el.dataset.e,note=r.querySelector('#en');note.textContent='Gerando...';
      try{let res;if(a==='pdfa'||a==='pdfs'){const blob=await buildPdf(m,a==='pdfa'?'a4':'size');res=await deliver(blob,fname(m,'pdf'),'application/pdf')}
        else if(a==='png')res=await exportPng(m);else if(a==='txt')res=await deliver(new Blob([toOutline(m.root)],{type:'text/plain'}),fname(m,'txt'),'text/plain');else res=await deliver(new Blob([mapBackup([m])],{type:'application/json'}),fname(m,'json'),'application/json');
        note.textContent=res==='download'?'Arquivo baixado.':res==='share'?'Compartilhado.':'Cancelado.'}
      catch(err){note.textContent='Falhou: '+(err&&err.message||'erro ao gerar')}finally{busy=false}})})}
/* ---------- inicialização ---------- */
function setIcons(){const set=(id,n,s)=>{const e=document.getElementById(id);if(e)e.innerHTML=uiIcon(n,s||22)};
  set('b-set','gear');set('t-back','back');set('t-undo','undo');set('t-redo','redo');set('t-search','search');set('t-style','style');set('t-share','share');set('t-more','more');set('z-in','plus',20);set('z-out','minus',20);set('z-fit','fit',20);set('s-next','next',18);set('s-close','close',18);
  $('#b-new').innerHTML=uiIcon('plus',20,2.6)+'<span>Novo mapa</span>'}
function openMore(){openSheet(shHead(M.name)+`<div class="sr" data-m="ren"><span>Renomear mapa</span></div><div class="sr" data-m="out"><span>Editar como texto</span></div><div class="sr" data-m="fit"><span>Ajustar à tela</span></div><div class="sr" data-m="dup"><span>Duplicar mapa</span></div>`,r=>{bindClose(r);
  onSheet(r,'[data-m]',el=>{const a=el.dataset.m;closeSheet(true);if(a==='ren')askText('Renomear mapa',M.name,v=>{pushUndo();M.name=v;touch(M);updateBars()});else if(a==='out')openOutline();else if(a==='fit')fitView();else if(a==='dup'){const c=JSON.parse(JSON.stringify(M));c.id=uid();c.name=M.name+' (cópia)';c.cr=c.up=Date.now();const re=x=>{x.id=nid();(x.c||[]).forEach(re)};re(c.root);c.rel=[];addMap(c);toast('Cópia criada na lista')}})})}
function bindUI(){
  document.addEventListener('click',e=>{const t=e.target;
    const a=t.closest&&t.closest('[data-a]');if(a){const k=a.dataset.a;
      if(k==='settings')openSettings();else if(k==='newmap')openNewMap();else if(k==='home')goHome();else if(k==='rename')askText('Renomear mapa',M.name,v=>{pushUndo();M.name=v;touch(M);updateBars()});
      else if(k==='undo')undo();else if(k==='redo')redo();else if(k==='search')openSearch();else if(k==='mstyle')openMapStyle();else if(k==='export')openExport();else if(k==='mtext')openMore();
      else if(k==='zin'||k==='zout'){const cv=$('#cv');zoomAt(k==='zin'?1.25:.8,cv.clientWidth/2,cv.clientHeight/2)}else if(k==='fit')fitView();else if(k==='snext')searchNext();else if(k==='sclose')closeSearch();return}
    const b=t.closest&&t.closest('[data-b]');if(b&&!b.classList.contains('off')){barAction(b.dataset.b);return}
    const mo=t.closest&&t.closest('[data-more]');if(mo){e.stopPropagation();openMapMenu(mo.dataset.more);return}
    const c=t.closest&&t.closest('#list [data-id]');if(c)openMap(c.dataset.id)});
  $('#sq').addEventListener('input',e=>{S.q=e.target.value;S.qi=0;searchUpdate();if(S.hits&&S.hits.length){S.sel=S.hits[0];draw();centerOn(S.hits[0])}});
  $('#sq').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchNext()}else if(e.key==='Escape')closeSearch()});
  window.addEventListener('resize',()=>{if(S.view==='ed'&&SC)applyVW()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){flushPersist()}else if(CFG)syncSoon()});
  window.addEventListener('pagehide',()=>{flushPersist()});window.addEventListener('online',()=>{if(CFG)syncSoon()})}
async function boot(){setIcons();
  try{const rows=await IDB.all('m:');rows.forEach(([k,v])=>{if(v&&typeof v==='object')D.recs[k.slice(2)]=v});CFG=(await IDB.get('cfg'))||null}catch(e){}
  bindEditor();bindGestures();bindKeys();bindUI();bindImagePicker();bindImport();showView('list');
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(CFG)syncSoon()}
boot();
</script>
